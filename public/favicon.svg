      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="60%" stop-color="#E4E4E7"/>
      <stop offset="100%" stop-color="#A1A1AA"/>
    </linearGradient>
    <linearGradient id="accent-core" x1="0%" y1="0%" x2="100%" y2="100%">
