name: Audit and deploy audit2
on:
  push:
    branches: [main]
  workflow_dispatch:
  pull_request:
    branches: [main]
permissions:
  contents: write
concurrency:
  group: audit2-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck, lint and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - run: npm install --no-audit --no-fund
      - name: Export generated npm lockfile for reproducibility audit
        uses: actions/upload-artifact@v7
        with:
          name: audit2-generated-lockfile
          path: package-lock.json
          if-no-files-found: error
      - name: Commit generated lockfile and restore production workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main --depth=1
          git show origin/main:.github/workflows/cloudflare.yml > .github/workflows/cloudflare.yml
          git add package-lock.json .github/workflows/cloudflare.yml
          if git diff --cached --quiet; then
            echo "No lockfile changes to commit"
          else
            git commit -m "chore: add npm lockfile"
            git push origin HEAD:${{ github.head_ref }}
          fi
      - name: Verify clean npm ci from committed lockfile
        shell: bash
        run: |
          rm -rf node_modules
          npm ci --no-audit --no-fund
      - run: npm run skills:check
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
      - name: Validate PostgreSQL backup parser
        run: DRY_RUN=1 node scripts/recover-postgres-backup-to-cloudflare.mjs

  deploy:
    name: Deploy to Cloudflare
    if: github.event_name == 'workflow_dispatch'
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - run: npm install --no-audit --no-fund
      - run: npx wrangler@latest d1 migrations apply DB --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - run: npx wrangler@latest deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
